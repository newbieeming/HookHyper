[versions]
# ── Build toolchain ──────────────────────────────────────────────────────────
agp             = "9.2.1"
kotlin          = "2.2.10"
ksp             = "2.2.10-2.0.2"

# ── AndroidX core ────────────────────────────────────────────────────────────
coreKtx         = "1.16.0"
lifecycleRuntimeKtx = "2.9.1"
activityCompose = "1.10.1"
savedstate      = "1.2.1"

# ── Compose ──────────────────────────────────────────────────────────────────
composeBom      = "2026.02.01"
composeMaterial3 = "1.5.0-alpha01"
navigation3     = "1.1.4"
lifecycleNavigation3 = "2.11.0"
miuix           = "0.9.1"
hiddenApiBypass = "6.1"

# ── DI ───────────────────────────────────────────────────────────────────────
hilt            = "2.60"
hiltNavigationCompose = "1.2.0"
hiltLifecycleCompose = "1.3.0"

# ── Hook ────────────────────────────────────────────────────────────────────
yukiHookApi     = "1.3.2"
kavaRef         = "1.0.2"
xposedApi       = "82"

# ── Storage ──────────────────────────────────────────────────────────────────
errorprone      = "2.26.1"
datastore       = "1.1.4"

# ── Serialization ─────────────────────────────────────────────────────────────
kotlinSerialization = "1.8.1"

# ── Coroutines ───────────────────────────────────────────────────────────────
coroutines      = "1.10.2"

# ── Code generation ──────────────────────────────────────────────────────────
kotlinPoet      = "2.0.0"

# ── Utilities ────────────────────────────────────────────────────────────────
timber          = "5.0.1"

# ── Testing ──────────────────────────────────────────────────────────────────
junit           = "4.13.2"
junitVersion    = "1.2.1"
espressoCore    = "3.6.1"

[libraries]
# ── AndroidX core ────────────────────────────────────────────────────────────
androidx-core-ktx               = { group = "androidx.core",              name = "core-ktx",                   version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx  = { group = "androidx.lifecycle",         name = "lifecycle-runtime-ktx",      version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle",      name = "lifecycle-runtime-compose",  version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel    = { group = "androidx.lifecycle",         name = "lifecycle-viewmodel-ktx",    version.ref = "lifecycleRuntimeKtx" }
androidx-viewmodel-savedstate     = { group = "androidx.lifecycle",         name = "lifecycle-viewmodel-savedstate", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose       = { group = "androidx.activity",          name = "activity-compose",           version.ref = "activityCompose" }
androidx-savedstate-ktx         = { group = "androidx.savedstate",        name = "savedstate-ktx",              version.ref = "savedstate" }

# ── Compose BOM + components ──────────────────────────────────────────────────
androidx-compose-bom             = { group = "androidx.compose",          name = "compose-bom",                version.ref = "composeBom" }
androidx-compose-ui              = { group = "androidx.compose.ui",       name = "ui" }
androidx-compose-ui-graphics     = { group = "androidx.compose.ui",       name = "ui-graphics" }
androidx-compose-ui-tooling      = { group = "androidx.compose.ui",       name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui",   name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest   = { group = "androidx.compose.ui",   name = "ui-test-manifest" }
androidx-compose-ui-test-junit4     = { group = "androidx.compose.ui",   name = "ui-test-junit4" }
androidx-compose-material3       = { group = "androidx.compose.material3", name = "material3",                 version.ref = "composeMaterial3" }
androidx-compose-material-icons  = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-navigation3-runtime     = { group = "androidx.navigation3",      name = "navigation3-runtime",        version.ref = "navigation3" }
androidx-navigation3-ui          = { group = "androidx.navigation3",      name = "navigation3-ui",             version.ref = "navigation3" }
androidx-lifecycle-viewmodel-navigation3 = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-navigation3", version.ref = "lifecycleNavigation3" }
miuix-ui-android                 = { group = "top.yukonga.miuix.kmp",    name = "miuix-ui-android",            version.ref = "miuix" }
miuix-preference-android         = { group = "top.yukonga.miuix.kmp",    name = "miuix-preference-android",    version.ref = "miuix" }

# ── Hilt ─────────────────────────────────────────────────────────────────────
hilt-android                    = { group = "com.google.dagger",          name = "hilt-android",               version.ref = "hilt" }
hilt-android-compiler           = { group = "com.google.dagger",          name = "hilt-android-compiler",      version.ref = "hilt" }
hilt-navigation-compose         = { group = "androidx.hilt",              name = "hilt-navigation-compose",    version.ref = "hiltNavigationCompose" }
androidx-hilt-lifecycle-viewmodel-compose = { group = "androidx.hilt",     name = "hilt-lifecycle-viewmodel-compose", version.ref = "hiltLifecycleCompose" }

# ── YukiHookAPI / Xposed ────────────────────────────────────────────────────
yukihookapi-api                 = { group = "com.highcapable.yukihookapi", name = "api",                       version.ref = "yukiHookApi" }
yukihookapi-ksp-xposed          = { group = "com.highcapable.yukihookapi", name = "ksp-xposed",                version.ref = "yukiHookApi" }
kavaref-core                    = { group = "com.highcapable.kavaref",     name = "kavaref-core",               version.ref = "kavaRef" }
kavaref-extension               = { group = "com.highcapable.kavaref",     name = "kavaref-extension",          version.ref = "kavaRef" }
xposed-api                      = { group = "de.robv.android.xposed",       name = "api",                        version.ref = "xposedApi" }

# ── DataStore ────────────────────────────────────────────────────────────────
datastore-preferences           = { group = "androidx.datastore",         name = "datastore-preferences",      version.ref = "datastore" }

# ── Serialization ─────────────────────────────────────────────────────────────
kotlin-serialization-json       = { group = "org.jetbrains.kotlinx",      name = "kotlinx-serialization-json", version.ref = "kotlinSerialization" }

# ── Coroutines ───────────────────────────────────────────────────────────────
kotlinx-coroutines-android      = { group = "org.jetbrains.kotlinx",      name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# ── Utilities ────────────────────────────────────────────────────────────────
timber                          = { group = "com.jakewharton.timber",     name = "timber",                     version.ref = "timber" }
errorprone-annotations          = { group = "com.google.errorprone",      name = "error_prone_annotations",    version.ref = "errorprone" }

# ── KSP / Code generation ──────────────────────────────────────────────────
ksp-api                          = { group = "com.google.devtools.ksp",    name = "symbol-processing-api",      version.ref = "ksp" }
kotlinpoet-ksp                   = { group = "com.squareup",              name = "kotlinpoet-ksp",             version.ref = "kotlinPoet" }

# ── Testing ──────────────────────────────────────────────────────────────────
junit                           = { group = "junit",                      name = "junit",                      version.ref = "junit" }
androidx-junit                  = { group = "androidx.test.ext",          name = "junit",                      version.ref = "junitVersion" }
androidx-espresso-core          = { group = "androidx.test.espresso",     name = "espresso-core",              version.ref = "espressoCore" }

[plugins]
# ── 标准插件（供 build-logic/convention compileOnly 引用，业务模块不直接使用）──
agp-application         = { id = "com.android.application",                       version.ref = "agp" }
agp-library             = { id = "com.android.library",                           version.ref = "agp" }
kotlin-android          = { id = "org.jetbrains.kotlin.android",                  version.ref = "kotlin" }
kotlin-compose          = { id = "org.jetbrains.kotlin.plugin.compose",           version.ref = "kotlin" }
kotlin-jvm              = { id = "org.jetbrains.kotlin.jvm",                      version.ref = "kotlin" }
kotlin-serialization    = { id = "org.jetbrains.kotlin.plugin.serialization",     version.ref = "kotlin" }
hilt                    = { id = "com.google.dagger.hilt.android",                version.ref = "hilt" }
ksp                     = { id = "com.google.devtools.ksp",                       version.ref = "ksp" }

# ── Convention plugins（由 build-logic 提供，业务模块统一使用这些）──────────
android-application         = { id = "hookhyper.android.application" }
android-application-compose = { id = "hookhyper.android.application.compose" }
android-library             = { id = "hookhyper.android.library" }
android-library-compose     = { id = "hookhyper.android.library.compose" }
android-hilt                = { id = "hookhyper.android.hilt" }
jvm-library                 = { id = "hookhyper.jvm.library" }
hook-module                 = { id = "hookhyper.hook.module" }
